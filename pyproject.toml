[project]
name = "python-coach"
version = "0.1.0"
description = "Coach Python : un projet par jour, compris avant d'etre code, note pour etre refait."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "markdown-it-py>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# projects/ contient les exercices de l'utilisateur : c'est la matiere notee.
# Ni le formateur ni le linter ne doivent y toucher - corriger son style a sa
# place fausserait la notation et effacerait son travail.
extend-exclude = ["projects"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Meme raison que pour ruff : les exercices ne sont pas du code de l'app.
exclude = ['^projects/']

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Les doubles et fixtures pytest recoivent des arguments qu'ils n'utilisent pas :
# c'est la signature du protocole ou l'effet de bord de la fixture qui compte.
"tests/*" = ["ARG001", "ARG002", "ARG005"]
